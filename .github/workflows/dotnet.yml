name: .NET CI

# Runs on pushes to this repository only. The build needs a secret, and a pull request target would hand it to
# code from a pull request.
on:
  push:
  workflow_dispatch:

env:
  GAME_VERSION: 1.5.78.11833

jobs:
  # Windows runs the .NET Framework tests natively; one of them loads the HKMP that this job builds.
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout commit
        uses: actions/checkout@v5

      # Without the variable, checkout falls back to this repository and the failure only shows up when unpacking.
      - name: Require game references settings
        env:
          REPOSITORY: ${{ vars.GAME_REFERENCES_REPOSITORY }}
          HAS_KEY: ${{ secrets.GAME_REFERENCES_DEPLOY_KEY != '' }}
        run: |
          [ -n "$REPOSITORY" ] || { echo "Set the GAME_REFERENCES_REPOSITORY variable."; exit 1; }
          [ "$HAS_KEY" = "true" ] || { echo "Set the GAME_REFERENCES_DEPLOY_KEY secret."; exit 1; }

      # The game's own assemblies cannot be public; a private repository holds them for the build only.
      - name: Check out game references
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.GAME_REFERENCES_REPOSITORY }}
          ssh-key: ${{ secrets.GAME_REFERENCES_DEPLOY_KEY }}
          sparse-checkout: ${{ env.GAME_VERSION }}/managed.tar.gz
          sparse-checkout-cone-mode: false
          path: game-references
          persist-credentials: false

      # HKMP/lib is where the example build properties point when no local file exists.
      - name: Unpack game references
        run: |
          mkdir HKMP/lib
          tar -xzf game-references/${{ env.GAME_VERSION }}/managed.tar.gz -C HKMP/lib
          rm -rf game-references
      
      - name: Copy HKMPServer dependencies
        run: |
          mkdir HKMPServer/Lib
          cp HKMP/lib/Newtonsoft.Json.dll HKMPServer/Lib

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c release --verbosity n

      - name: Test
        run: dotnet test HKMP.Tests -c Release

      - name: Upload HKMP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HKMP
          path: |
            HKMP/bin/Release/net472/HKMP.dll
            HKMP/bin/Release/net472/HKMP.xml
            HKMP/bin/Release/net472/HKMP.pdb
            HKMP/bin/Release/net472/BouncyCastle.Cryptography.dll
      
      - name: Upload HKMPServer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HKMPServer
          path: |
            HKMPServer/bin/Release/net472/HKMPServer.exe
            HKMPServer/bin/Release/net472/HKMPServer.pdb
            HKMPServer/bin/Release/net472/HKMP.dll
            HKMPServer/bin/Release/net472/HKMP.pdb
            HKMPServer/bin/Release/net472/Newtonsoft.Json.dll
            HKMPServer/bin/Release/net472/BouncyCastle.Cryptography.dll
