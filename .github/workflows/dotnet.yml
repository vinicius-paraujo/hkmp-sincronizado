name: .NET CI

# Runs on pushes to this repository only. The build needs a secret, and a pull request target would hand it to
# code from a pull request.
on:
  push:
  workflow_dispatch:

env:
  GAME_VERSION: 1.5.78.11833

jobs:
  # The tests compile the fork's own logic against small doubles of the game types, so they need no game files.
  # They target .NET Framework, which runs natively on Windows.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test HKMP.Tests -c Release

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout commit
        uses: actions/checkout@v5

      # Without the variable, checkout falls back to this repository and the failure only shows up when unpacking.
      - name: Require game references settings
        env:
          REPOSITORY: ${{ vars.GAME_REFERENCES_REPOSITORY }}
          HAS_KEY: ${{ secrets.GAME_REFERENCES_DEPLOY_KEY != '' }}
        run: |
          [ -n "$REPOSITORY" ] || { echo "Set the GAME_REFERENCES_REPOSITORY variable."; exit 1; }
          [ "$HAS_KEY" = "true" ] || { echo "Set the GAME_REFERENCES_DEPLOY_KEY secret."; exit 1; }

      # The game's own assemblies cannot be public; a private repository holds them for the build only.
      - name: Check out game references
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.GAME_REFERENCES_REPOSITORY }}
          ssh-key: ${{ secrets.GAME_REFERENCES_DEPLOY_KEY }}
          sparse-checkout: ${{ env.GAME_VERSION }}/managed.tar.gz
          sparse-checkout-cone-mode: false
          path: game-references
          persist-credentials: false

      # HKMP/lib is where the example build properties point when no local file exists.
      - name: Unpack game references
        run: |
          mkdir ${{ github.workspace }}/HKMP/lib
          tar -xzf game-references/${{ env.GAME_VERSION }}/managed.tar.gz -C ${{ github.workspace }}/HKMP/lib
          rm -rf game-references
      
      - name: Copy HKMPServer dependencies
        run: |
          mkdir ${{ github.workspace }}/HKMPServer/Lib
          cp ${{ github.workspace }}/HKMP/lib/Newtonsoft.Json.dll ${{ github.workspace }}/HKMPServer/Lib

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ${{ github.workspace }}

      - name: Build
        run: dotnet build --no-restore -c release --verbosity n ${{ github.workspace }}

      - name: Upload HKMP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HKMP
          path: |
            ${{ github.workspace }}/HKMP/bin/Release/net472/HKMP.dll
            ${{ github.workspace }}/HKMP/bin/Release/net472/HKMP.xml
            ${{ github.workspace }}/HKMP/bin/Release/net472/HKMP.pdb
            ${{ github.workspace }}/HKMP/bin/Release/net472/BouncyCastle.Cryptography.dll
      
      - name: Upload HKMPServer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HKMPServer
          path: |
            ${{ github.workspace }}/HKMPServer/bin/Release/net472/HKMPServer.exe
            ${{ github.workspace }}/HKMPServer/bin/Release/net472/HKMPServer.pdb
            ${{ github.workspace }}/HKMPServer/bin/Release/net472/HKMP.dll
            ${{ github.workspace }}/HKMPServer/bin/Release/net472/HKMP.pdb
            ${{ github.workspace }}/HKMPServer/bin/Release/net472/Newtonsoft.Json.dll
            ${{ github.workspace }}/HKMPServer/bin/Release/net472/BouncyCastle.Cryptography.dll
